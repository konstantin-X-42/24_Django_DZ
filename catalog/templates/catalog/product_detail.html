{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <!-- Кнопка возврата на главную по требованиям ТЗ (переходы туда и обратно) -->
    <a href="{% url 'catalog:21-2_home1' %}" class="btn btn-outline-secondary mb-4">&larr; Назад на главную</a>

    <div class="row bg-white p-4 rounded shadow-sm">
        <!-- Блок изображения товара -->
        <div class="col-md-5 text-center mb-4 mb-md-0">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}" style="max-height: 400px; object-fit: contain;">
            {% else %}
                <div class="bg-light text-muted d-flex align-items-center justify-content-center rounded" style="height: 300px;">
                    <span>Нет изображения</span>
                </div>
            {% endif %}
        </div>

        <!-- Блок с подробной информацией о товаре -->
        <div class="col-md-7 d-flex flex-column justify-content-between">
            <div>
                <h1 class="display-5 fw-bold mb-3">{{ product.name }}</h1>
                <p class="text-muted mb-4">Категория: <span class="badge bg-secondary">{{ product.category.name }}</span></p>
                <hr>
                <!-- Полное описание без ограничений -->
                <p class="lead text-dark" style="white-space: pre-wrap;">{{ product.description }}</p>
            </div>

            <div class="mt-4">
                <div class="mb-3">
                    <span class="text-muted d-block">Цена за покупку:</span>
                    <span class="h2 fw-bold text-success">${{ product.price }}</span>
                </div>
                <button class="btn btn-primary btn-lg px-5">Купить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
